---
- name: TASKS | MAIN | Include host_packages tasks
  include_tasks: host_packages.yml
  when: inventory_hostname != template_build_host

- name: TASKS | MAIN | Include host_vars tasks
  include_tasks: host_vars.yml
  when: inventory_hostname != template_build_host

- include_tasks: prepare_image.yml
  when: inventory_hostname == template_build_host

- name: TASKS | MAIN | Include vm_create tasks
  include_tasks: vm_create.yml
  when: inventory_hostname != template_build_host

- name: TASKS | MAIN | Include vm_firewall tasks
  include_tasks: vm_firewall.yml
  when: inventory_hostname != template_build_host
