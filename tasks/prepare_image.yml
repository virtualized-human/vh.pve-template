---
- name: TASKS | PREPARE_IMAGE | Install build dependencies
  when: template_image_resize | length > 0 or (template_image_custom | bool)
  ansible.builtin.apt:
    name:
      - libguestfs-tools
      - qemu-utils
    state: present

- name: TASKS | PREPARE_IMAGE | Create temporary build directory
  tempfile:
    state: directory
  register: _build_tmp

- name: TASKS | PREPARE_IMAGE | Allow build directory readable
  ansible.builtin.file:
    path: "{{ _build_tmp.path }}"
    state: directory
    mode: "0755"

- name: TASKS | PREPARE_IMAGE | Download cloud image
  get_url:
    url: "{{ template_image_url }}"
    dest: "{{ _build_tmp.path }}/image"
    timeout: 1800
  when: template_image_url is defined

- name: TASKS | PREPARE_IMAGE | Grow disk image
  when: template_image_resize | length > 0
  shell: qemu-img resize {{ _build_tmp.path }}/image {{ template_image_resize }}

- name: TASKS | PREPARE_IMAGE | Customize image
  when: template_image_custom | bool
  block:
    - name: Copy CMD scripts
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ _build_tmp.path }}/{{ item | basename }}"
      loop: "{{ template_image_custom_cmd_script | default([]) }}"

    - name: Copy firstboot scripts
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ _build_tmp.path }}/{{ item | basename }}"
      loop: "{{ template_image_custom_firstboot_script | default([]) }}"

    - name: Apply customizations
      ansible.builtin.shell: |
        virt-customize \
          -a "{{ _build_tmp.path }}/image" \
          --update \
        {% for pkg in template_image_custom_install | default([]) %}
          --install '{{ pkg }}' \
        {% endfor %}
        {% for cmd in template_image_custom_cmd | default([]) %}
          --run-command '{{ cmd }}' \
        {% endfor %}
        {% for script in template_image_custom_cmd_script | default([]) %}
          --run '{{ _build_tmp.path }}/{{ script | basename }}' \
        {% endfor %}
        {% for cmd in template_image_custom_firstboot | default([]) %}
          --firstboot-command '{{ cmd }}' \
        {% endfor %}
        {% for script in template_image_custom_firstboot_script | default([]) %}
          --firstboot '{{ _build_tmp.path }}/{{ script | basename }}' \
        {% endfor %}
      args:
        executable: /bin/bash
